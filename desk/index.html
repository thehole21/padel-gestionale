<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PadelDesk OS</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef2ea;color:#19312a;font:16px system-ui}main{max-width:1050px;margin:auto;padding:28px}header,article,section{background:white;padding:20px;border-radius:12px;margin-bottom:15px}header{background:#19312a;color:white}h1,h2,h3{margin:0 0 12px}button,input,select{font:inherit;padding:8px;border:1px solid #c3ccbf;border-radius:6px}button{cursor:pointer;background:#dcf58d}label{display:inline-grid;gap:4px;font-size:13px;margin:5px}p{line-height:1.55}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid #eee}.debt{color:#aa291e;font-weight:700}.alert{background:#dcf58d;padding:12px}small{color:#53685c}output{display:block;color:#aa291e}</style>
<main><header><h1>PadelDesk OS</h1>Agenda, cassa e sostituzioni</header><output role="alert" id="error"></output><div id="alerts" aria-live="polite"></div><div id="desk"></div></main>
<script type="module">
const desk=document.querySelector('#desk'),error=document.querySelector('#error');let state;
const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const eur=v=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(v/100);
async function load(path='/api/state',data){const r=await fetch(path,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});const result=await r.json();if(!r.ok)throw Error(result.error||'Richiesta fallita');state=result}
function render(){const player=id=>state.players.find(p=>p.id===id);document.querySelector('#alerts').innerHTML=state.searches.filter(s=>s.winner).map(s=>'<p class="alert">'+esc(player(s.winner).name)+' ha accettato. Inserisci il giocatore manualmente su Playtomic.</p>').join('');
desk.innerHTML='<section><h2>Chiusura turno</h2><p>'+['Contanti','POS','Credito'].map(m=>m+' <b>'+eur(state.report.find(x=>x.method===m)?.total||0)+'</b>').join(' � ')+'</p><small>Movimenti di oggi � '+esc(state.date)+'</small></section><section><h2>Agenda Playtomic</h2><p>Importazione simulata � sola lettura</p><button data-sync>Aggiorna prenotazioni</button></section>'+state.bookings.map(b=>'<article><h3>'+esc(b.time)+' � '+esc(b.court)+'</h3><small>'+b.players.length+'/4 giocatori � quota '+eur(b.fee)+'</small>'+b.players.map(id=>{const p=player(id);const paid=state.movements.find(m=>m.booking===b.id&&m.player===id&&['POS','Contanti','Credito'].includes(m.method));return '<div class="row"><b>'+esc(p.name)+'</b>'+(p.debt?'<span class="debt">Insoluti '+eur(p.debt)+'</span>':'')+(paid?'Pagato � '+paid.method:'<form data-pay><input type="hidden" name="booking" value="'+esc(b.id)+'"><input type="hidden" name="player" value="'+esc(id)+'"><select name="method">'+['Contanti','POS','Credito','Insoluto'].map(m=>'<option>'+m+'</option>').join('')+'</select> <button>Registra quota</button></form>')+'</div>'}).join('')+(b.players.length<4?'<form data-search><input type="hidden" name="booking" value="'+esc(b.id)+'"><label>Livello minimo<input name="min" type="number" step=".1" value="3.5"></label><label>Massimo<input name="max" type="number" step=".1" value="4.5"></label><button>Trova sostituto</button></form>':'')+'</article>').join('')+'<section><h2>Ricerche WhatsApp</h2><small>'+ (state.live?'Invio attivo':'Modalit� simulazione')+'</small>'+state.searches.map(s=>'<p>'+esc(s.booking)+' � '+(s.winner?'Chiusa':'Aperta')+'</p>'+s.invites.map(i=>'<div class="row">'+esc(player(i.player).name)+' � '+esc(i.status)+(!s.winner&&!state.live?' <button data-reply="'+esc(s.id)+'" data-player="'+esc(i.player)+'">Simula PRENOTO</button>':'')+'</div>').join('')).join('')+'</section><section><h2>Anagrafica e crediti</h2>'+state.players.map(p=>'<details><summary>'+esc(p.name)+' � credito '+eur(p.credit)+' � insoluti '+eur(p.debt)+'</summary><form data-profile><input type="hidden" name="player" value="'+esc(p.id)+'"><label>WhatsApp con prefisso, solo cifre<input required name="phone" value="'+esc(p.phone)+'"></label><label>Livello<input type="number" step=".1" name="level" value="'+p.level+'"></label><label>Ora preferita<input type="number" min="0" max="23" name="hour" value="'+p.hour+'"></label><button>Salva</button></form><form data-credit><input type="hidden" name="player" value="'+esc(p.id)+'"><label>Ricarica ?<input required type="number" min=".01" step=".01" name="amount"></label><button>Carica credito</button></form></details>').join('')+'</section>'}
async function act(path,data){try{error.textContent='';await load(path,data);render()}catch(e){error.textContent=e.message}}
desk.onsubmit=e=>{e.preventDefault();const f=e.target,p=Object.fromEntries(new FormData(f));if(f.hasAttribute('data-profile'))return act('/api/profile',p);if(f.hasAttribute('data-search'))return act('/api/search',p);if(f.hasAttribute('data-credit')){p.amount=Math.round(Number(p.amount)*100);p.method='Ricarica'}p.id=crypto.randomUUID();act('/api/payment',p)};
desk.onclick=e=>{const b=e.target;if(b.hasAttribute('data-sync'))act('/api/sync',{});if(b.dataset.reply)act('/api/reply',{search:b.dataset.reply,player:b.dataset.player})};
await act('/api/state');setInterval(async()=>{if(document.activeElement.matches('input,select')||document.querySelector('details[open]'))return;try{await load();render()}catch(e){error.textContent=e.message}},5000)
</script></html>
